[project]
name = "preq-pmob"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = { text = "MIT" }
authors = [
  { name = "s-kat0", email = "34226464+stktu@users.noreply.github.com" },
]
dependencies = [
  "jupyter>=1.1.1,<2.0.0",
  "pytest>=8.3.3,<9.0.0",
  "typed-argument-parser>=1.10.1,<2.0.0",
  "psutil>=6.1.0,<7.0.0",
  "numpy>=2.2.1,<3.0.0",
]

[tool.uv]
dev-dependencies = [
  "flake8>=7.1.1,<8.0.0",
  "black>=24.10.0,<25.0.0",
  "isort>=5.13.2,<6.0.0",
  "mypy>=1.13.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["preq_pmob*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.flake8]
exclude = ".git, .tox, .venv, .eggs, build, dist, docs"
extend-ignore = "E203, W503, W504"
max-line-length = 99

[tool.black]
exclude = """
/(
    .eggs
  | .git
  | .hg
  | .pytest_cache
  | .mypy_cache
  | .tox
  | .venv
  | build
  | dist
)/
"""

[tool.isort]
profile = "black"
include_trailing_comma = true
multi_line_output = 3

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
